name: ci
on:
  push: { branches: [master] }
  pull_request:
  # schedule 已摘（C′ 终裁 2026-10-05）：nightly 自动跑取消——specb 套件真消费 MinIO（putObject
  # 素材+公开页 e2e）而 MinIO 容器镜像 2025 全网下架（Hub repo 404/bitnami tags 清零/quay 私有/
  # dl.min.io 410），runner 上必红；发布门禁以**本地 gate 人工跑**为准（本地有真 MinIO：
  # node scripts/gate-collab.mjs）。dispatch 保留=环境修复（如换 S3 兼容源）后的回归入口，
  # 当下 dispatch 仍会红在 specb-gate-seed 的 MinIO 段——属已知，非新回归（TD-26⑤）。
  workflow_dispatch:

# R3'（v3）：新 push 取代旧 run——6h hang 形态下省 runner（#62-66 人工取消的机制化）。
# 取舍登记（spec §6.3）：master 连续 push 时中间 commit 的 run 被取代（单人线性流信号取舍）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }} # event_name 入键——dispatch/push 互不取消
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request' # nightly 只跑 e2e-collab
    runs-on: ubuntu-latest
    timeout-minutes: 60    # verify tier=full 实测 ~11min
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: flowweb, POSTGRES_PASSWORD: '123456', POSTGRES_DB: flowweb }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      # Y1a T0：S3 兼容服务=RustFS（MinIO 镜像 2025 全网下架的替代——选型实证：seaweedfs 官方镜像
      # entrypoint 需 weed 子命令无法作 GH service container〔seaweedfs#9247〕；localstack 2026-03 起
      # s3 镜像 healthcheck 损坏〔localstack#13899〕+#11259 ~10% 间歇 unhealthy=CI 稳定性风险；
      # rustfs=Apache 2.0/alpine 基底含 curl（health-cmd 可用）/默认 CMD 自启动（service container
      # 免传参）/官方健康端点 /health。pin 1.0.0（2026-09-16 stable tag，禁 latest 滚动）。
      # api 经 S3 SDK path-style 兼容端点消费（minio.service forcePathStyle——见下方 MINIO_* 接线）。
      s3:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: flowweb-ci
          RUSTFS_SECRET_KEY: flowweb-ci-secret
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl --fail http://localhost:9000/health"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # 必填键对照 apps/api/src/config/env.ts：无默认必填 = DATABASE_URL/MINIO_ENDPOINT/MINIO_ACCESS_KEY/MINIO_SECRET_KEY。
      # MINIO_*（Y1a T0）：从"不设"翻转为真接线——前提已变：上方 rustfs service 真跑（旧注释"设假值
      # 反而误导"成立于 service 不可得时代）。键名/形态与本地开发一致（env.ts：ENDPOINT url/
      # ACCESS_KEY≥3/SECRET_KEY≥8；MINIO_USE_SSL 不设=transform 默认 false 即 http）。
      # 当下 api 单测仍全 mock（无连接面变化）；接线是 Y1a T4/T7（confirm 嗅探/probe）真消费的前置。
      # JWT_SECRET 全仓无引用（env.ts 无此键），不设。
      # REDIS_URL 虽有默认值，显式指到 service 端口以免默认值与 service 映射漂移。
      DATABASE_URL: postgresql://flowweb:123456@localhost:5432/flowweb
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: flowweb-ci
      MINIO_SECRET_KEY: flowweb-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # prisma generate：pnpm 默认不执行依赖包 build/postinstall 脚本（@prisma/client 的
      # postinstall=generate）——CI 首跑实证：无此步则 .prisma/client 为 stub，api tsc 全线
      # "no exported member 'Session'..." 炸（本地绿是因本地 client 早已生成）。两 job 均需。
      - run: pnpm --filter @flowweb/api exec prisma generate
      - run: pnpm --filter @flowweb/shared build
      - run: node scripts/check-hocuspocus-pin.mjs
      # Y1a T0：ffprobe/ffmpeg pin 8.1.x（plan Tech Stack「ffprobe 8.1.2」——8.1.2 精确二进制在静态
      # 构建源不可得：johnvansickle 停更于 7.0.2〔2024-06〕；BtbN 只建分支 head；FedericoCarboni/
      # setup-ffmpeg Linux 源=johnvansickle 同无 8.x；BtbN autobuild 日期 tag 月度保留会 404）。
      # **S0 CI 修复（2026-10-20，run 39447120329 实证）**：BtbN latest 资产每日重建——T0 落锁当天
      # 上游即重建致 sha 漂移红；「滚动 URL+sha256 内容锁」结构性矛盾。根修=**资产自托管**：BtbN
      # n8.1 资产固化到本仓 Release ffmpeg-pin-8.1（prerelease，2026-10-20 抓取，实际版本
      # n8.1.3-18 系），URL 永稳+sha256 锁有效。重 pin 流程=下载新 BtbN 资产→删除并重传本 Release
      # 资产（注意 CDN 缓存约 1 分钟过期）→更新下方 sha256→验证版本断言。装 /usr/local/bin 走
      # PATH（FFPROBE_PATH 消费点缺省 'ffprobe'——video-trim.constants/media-process 同款）。
      # apt 不满足：ubuntu 镜像滚动自带 ffmpeg 6.1.x。服务器侧（Ubuntu 24.04）同源对齐已随
      # Y1a T7（E4 裁定）落地=deploy.sh「ffprobe」模式（自托管 Release→/usr/local/bin，人工触发）。
      - name: ffprobe 8.1.x pin（本仓 Release 自托管+sha256 内容锁）
        run: |
          curl -sfL -o /tmp/ffmpeg-81.tar.xz \
            https://github.com/linklvx/flowweb/releases/download/ffmpeg-pin-8.1/ffmpeg-n8.1-linux64-gpl-8.1.tar.xz
          echo "e3ae56bf0e735159fb7aa522a01d347e9d842219cd3bbe751e09f6f6be26079e  /tmp/ffmpeg-81.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg-81.tar.xz -C /tmp
          sudo install -m 0755 /tmp/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin/ffprobe /usr/local/bin/ffprobe
          sudo install -m 0755 /tmp/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin/ffmpeg /usr/local/bin/ffmpeg
          ffprobe -version | head -1
          ffprobe -version | head -1 | grep -Eq '^ffprobe version n?8\.1\.' || { echo 'ffprobe 版本漂移（非 8.1.x 线——BtbN 版本串形态=n8.1.3-18-g<sha>-<date>，run 39450135291 实证）——重 pin 流程见上方注释'; exit 1; }
      # 表必须先于 verify 建好（0.5 的 int spec 直连真库且 skip 条件只看 DATABASE_URL 存在——
      # 0.5 已落地，按预留注记启用）。migrate deploy=幂等（已应用跳过）。
      - run: pnpm --filter @flowweb/api exec prisma migrate deploy
      # 单一真相源：CI 直接跑 verify（shared typecheck/test + web/api tsc + 全测 + web lint +
      # api eslint〔链尾〕+check-ecosystem/spec-consistency/scripts node:test）。api eslint 独立
      # step 已删（Z57 外审收口 2026-10-11：批0e-3 时代的"verify 未含 api lint"已失实——根 verify
      # 尾段现已含，独立 step=重复执行；红信号仍落本 job，无掩蔽）。
      - run: pnpm verify
        timeout-minutes: 55
      # Y0a-4：deploy.sh 语法校验（CI 承载跨平台兜底——本地也可用 Git for Windows 真 bash -n）
      - name: deploy.sh 语法校验（Y0a-4——bash -n 跨平台承载）
        run: bash -n deploy.sh

  # 第八轮拆分：文档门禁独立 job——verify && 链内 doc-gate 的红会掩掉下游测试信号、自身红绿也被
  # flaky 噪声吞掉（TD-26②）；required check 粒度需单独可读（test+doc-gate 双 required=机制+强制）。
  # doc-gate 零 npm 依赖（node 内建+git），无需 pnpm install。
  doc-gate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/doc-gate.mjs

  # 0 号动作 E41：密钥防回归门禁（判定标准=零新增命中，非吊销已知密钥——2026-10-06
  # 用户裁定源码存量均为测试密钥公开无妨）。全历史扫描+仓根 .gitleaks.toml 豁免存量；
  # 本地等价：gitleaks detect --source .；pre-commit 侧 protect --staged（scripts/hooks/）。
  # 故意变红证据（D13）：高熵假密钥 sk-9fQ2…入暂存区 → protect --staged exit 1（2026-10-06）。
  # gitleaks 版本 pin 8.30.1（与本地验证同版本，配置即契约）。
  gitleaks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10    # 全历史扫描+二进制下载
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact -v

  # 批7 双客户端 E2E 发布门禁（spec v5.10 目标 8 链路）：nightly schedule + workflow_dispatch，
  # PR 不跑；步骤=gate 脚本单一真相源（预检→自拉 API(COLLAB_FAKE_AI=1)→playwright collab-recovery→清理）。
  # 本地等价：node scripts/gate-collab.mjs。手动清单：docs/superpowers/plans/collab-e2e-gate-checklist.md
  e2e-collab:
    if: github.event_name == 'workflow_dispatch' # schedule 已摘（C′）——dispatch-only 回归入口，当下 runner 上仍红（MinIO，见上方摘 cron 注记）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: flowweb, POSTGRES_PASSWORD: '123456', POSTGRES_DB: flowweb }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://flowweb:123456@localhost:5432/flowweb
      REDIS_URL: redis://localhost:6379/0
      # validateEnv 必填键（app.module 链路真启动）。MinIO 初始化由 gate-collab.mjs 注入
      # MINIO_INIT=skip 显式裁剪（B′，2026-10-05 终裁）：gate 场景零 MinIO 产物消费；真
      # service 不可得——镜像分发 2025 全网下架（docker.io repo 404/bitnami tags 清零/
      # quay 匿名不可拉/dl.min.io 410）。生产 fail-fast 不动（不设 env 即真连失败 throw）。
      # 下方 MINIO_* 值仅满足 validateEnv 必填校验——skip 路径无连接发生。
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 同 test job：pnpm 不跑依赖 postinstall，gate 的 api build（tsc）需要 prisma client
      # （migrate deploy+seed 由 gate 脚本自带 :166-167）
      - run: pnpm --filter @flowweb/api exec prisma generate
      - run: node scripts/gate-collab.mjs
      # R2d-8 追加三 step（token 门禁进 CI——本地先绿再挂）。web 前置确认：gate 只自拉 API
      # （dist/main.js 子进程，finally 恒收）；web 5173 归 collab 配置 webServer（vite preview），
      # 随 playwright 退出自动拆除——gate 步结束后 3000/3001/5173 全空闲。下列步骤走默认
      # playwright.config.ts 自管双 webServer（API=migrate deploy+seed+nest start /
      # web=build+preview，均 reuse=false/true 语义内建），自包含无需额外前置；
      # css-baseline-diff 纯静态基线比对（不启动浏览器/服务）。
      - run: pnpm --filter @flowweb/web exec playwright test e2e/b0-token-blocks.spec.ts
      - run: pnpm --filter @flowweb/web exec playwright test e2e/b1-token-migration.spec.ts --grep "B1-4"
      - run: node apps/web/scripts/css-baseline-diff.mjs

  # Y0a-1（E69③ 最小起步·spec §4.5 v2.4 收敛）→Y0a-3 演进：int 真库全集（vitest.int.config 专用池
  # 串行）+check-int-coverage 四判据（集合≡执行集/零失败/零跳过/下限）。库锚/语料/契约门禁均为常规
  # vitest spec——test job 经 verify 已常跑，此处重跑=第二真源（防双源，"collab 绿"唯一定义=test job）；
  # kill -9/SIGTERM/handover 演练自 Y0a-2/3 起；dist 泄漏断言已入根 verify（Task 7）。
  collab-core:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30    # 6+8+10=24+ffprobe pin<0.5+setup<30（plan T4 算术；Y1a T7 增补 ffprobe 步）
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: flowweb, POSTGRES_PASSWORD: '123456', POSTGRES_DB: flowweb }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      # Y0a-2（X3/P7）：演练子进程起 AppModule 含 BullMQ（subscription-scheduler onModuleInit await
      # getRepeatableJobs——无 Redis 即挂起）——spec §4.5"redis service Y0a-3 起补"按演练实际需求提前（偏差已登记）。
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      # Y1a+Y1b T5（出口判据「CI 真 S3」）：int 池真 S3 语义（media-content ready 态真上传/下载——
      # rustfs 选型依据见 test job 同款注释；本地开发=本地 MinIO，双实现 S3 兼容语义互容）。
      s3:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: flowweb-ci
          RUSTFS_SECRET_KEY: flowweb-ci-secret
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl --fail http://localhost:9000/health"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://flowweb:123456@localhost:5432/flowweb
      REDIS_URL: redis://localhost:6379/0
      # MINIO_*（X3→T5 演进）：T5 起指真 rustfs（int 池 S3 语义；键同 test job）。演练子进程不受影响——
      # MINIO_INIT=skip 仍跳过 AppModule 启动期 ensureBucket（演练零对象存储消费），int spec 直构
      # MinioService 自带 ensureBucket（幂等）。
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: flowweb-ci
      MINIO_SECRET_KEY: flowweb-ci-secret
      # MINIO_INIT=skip（X3 语义维持）：演练子进程启动期 ensureBucket 显式跳过（app boot 面）——
      # 不再需要占位 MINIO_* 值（上方已指真 rustfs）。
      MINIO_INIT: skip
      # Y0b-2 T2（Z93 兜底）：api-caller onModuleInit 缺密钥拒启——CI 零密钥（迁移 INSERT apiKey
      # 显式 NULL、无 seed 步）下演练子进程起 AppModule 会拒启；COLLAB_FAKE_AI=1 显式豁免档。
      # int 套件直构服务不经 onModuleInit（实测断言不触发）——本值是防未来 int 加 .init() 的兜底。
      COLLAB_FAKE_AI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowweb/api exec prisma generate
      - run: pnpm --filter @flowweb/shared build
      - run: pnpm --filter @flowweb/api exec prisma migrate deploy
      # Y1a T7（E4 裁定 2026-10-20）：collab-core job 补装 ffprobe——int 池 media-probe.int.spec 真调
      # ffprobe/sharp（probe 视频路径）；步内容=test job 同款原样复制（自托管 Release+sha256 内容锁
      # +版本断言——重 pin 流程见 test job 注释）。生产侧同源对齐=deploy.sh「ffprobe」模式（E4 后半）。
      - name: ffprobe 8.1.x pin（本仓 Release 自托管+sha256 内容锁）
        run: |
          curl -sfL -o /tmp/ffmpeg-81.tar.xz \
            https://github.com/linklvx/flowweb/releases/download/ffmpeg-pin-8.1/ffmpeg-n8.1-linux64-gpl-8.1.tar.xz
          echo "e3ae56bf0e735159fb7aa522a01d347e9d842219cd3bbe751e09f6f6be26079e  /tmp/ffmpeg-81.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg-81.tar.xz -C /tmp
          sudo install -m 0755 /tmp/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin/ffprobe /usr/local/bin/ffprobe
          sudo install -m 0755 /tmp/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin/ffmpeg /usr/local/bin/ffmpeg
          ffprobe -version | head -1
          ffprobe -version | head -1 | grep -Eq '^ffprobe version n?8\.1\.' || { echo 'ffprobe 版本漂移（非 8.1.x 线——BtbN 版本串形态=n8.1.3-18-g<sha>-<date>，run 39450135291 实证）——重 pin 流程见 test job 注释'; exit 1; }
      # Y0c T5（Z80/Z18/Z123）：库行为锚=版本 pin 语义的 CI 保障（@hocuspocus 4.6.0 实现细节漂移即红）。
      # unit 形态（独立最小 Server+mock 装置，零 DB/Redis 依赖）；test job 的 verify 全量常跑同文件，
      # 此处 targeted 重跑=第二真源（本 job 注释头同款口径）——Z18 版本变化必重跑清单的执行入口之一。
      - name: collab 库行为锚（Z80 四锚+A5-A14——版本 pin 语义 CI 保障）
        run: pnpm --filter @flowweb/api exec vitest run src/modules/collab/collab.library-anchors.spec.ts
      # Y0a-3（V27/X16）：专用配置串行（CollabLease 单行全局资源，fileParallelism=false）+集合断言
      # 单源化——显式清单+条数阈值退役（新增 int 文件漏登记=静默漏跑的根因由 git ls-files 集合比对消除）。
      - name: collab int（专用配置串行——CollabLease 单行全局资源；双 reporter=失败用例名在 CI 日志可读）
        timeout-minutes: 6
        # 步级覆盖：job 级 COLLAB_FAKE_AI=1（演练子进程豁免档）不得泄入 int 池——T9 query-first
        # 用例（execseq-generation.int.spec）依赖真 HTTP mock provider，fake 档会令 callImageGen
        # 零外呼直接返回假图（api-caller.service.ts fakeAiEnabled 首行短路）=三用例必红。
        env: { COLLAB_FAKE_AI: '' }
        run: pnpm --filter @flowweb/api test:int:ci
      - name: int 完整性断言（V27——集合+零失败+零跳过+下限）
        run: node scripts/check-int-coverage.mjs
      # Y0a-2/3 演练=本 job 真增量（子进程形态 test job 无法跑，spec §4.5③）：七跑必须串行——触发器函数名
      # 全局共享（Task 9 Minor 5）+租约行全局共享（Z25）；驱动 tsx 直跑（驱动自身无 DI），server 侧由驱动
      # 先跑 tsconfig.drill.json 全量 tsc（首次编译时间计入本步预算，不设独立上界）+dist-drill 产物在 job
      # workspace；Linux 走 SIGTERM 真信号=生产同构通道；env 供给=job 级 DATABASE_URL/REDIS_URL+驱动内
      # 注入 MINIO 占位（双保险）。
      - name: kill -9/SIGTERM/handover 演练（G-1 双模式+G-2a 双档+Z25 三变体——RPO/接管契约的唯一测试证明）
        timeout-minutes: 8
        run: |
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=kill9-normal
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=kill9-fault
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=sigterm
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=sigterm --spool-fail
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=handover
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=handover --graceful
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=handover --usurp
      # Y0b-5 T9：write-frozen 全链演练（spec §5.3 验收链——drain 冻结/权威快照重放/shrink 解除锚+编辑中
      # kill9 RPO 档〔裁定 23⑮/24⑸尾〕）。kill9 族旁追加同款条件/环境：node 直跑 mjs（驱动无 DI——
      # 首跑自带 tsconfig.drill.json 编译，上一步 kill9 已产出 dist-drill 则增量）；两模式串行（随机端口+租约行全局资源）。
      - name: write-frozen 全链演练（T9——drain 冻结+权威快照重放+shrink 解除+编辑中 kill9 双断言）
        timeout-minutes: 10
        run: |
          pnpm --filter @flowweb/api exec node scripts/write-frozen-drill.mjs --mode=frozen-chain
          pnpm --filter @flowweb/api exec node scripts/write-frozen-drill.mjs --mode=mid-edit-kill9
