name: ci
on:
  push: { branches: [master] }
  pull_request:
  # schedule 已摘（C′ 终裁 2026-10-05）：nightly 自动跑取消——specb 套件真消费 MinIO（putObject
  # 素材+公开页 e2e）而 MinIO 容器镜像 2025 全网下架（Hub repo 404/bitnami tags 清零/quay 私有/
  # dl.min.io 410），runner 上必红；发布门禁以**本地 gate 人工跑**为准（本地有真 MinIO：
  # node scripts/gate-collab.mjs）。dispatch 保留=环境修复（如换 S3 兼容源）后的回归入口，
  # 当下 dispatch 仍会红在 specb-gate-seed 的 MinIO 段——属已知，非新回归（TD-26⑤）。
  workflow_dispatch:
jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request' # nightly 只跑 e2e-collab
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: flowweb, POSTGRES_PASSWORD: '123456', POSTGRES_DB: flowweb }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # 必填键对照 apps/api/src/config/env.ts：无默认必填 = DATABASE_URL/MINIO_ENDPOINT/MINIO_ACCESS_KEY/MINIO_SECRET_KEY。
      # MINIO_* 不设：api 单测全 mock，validateEnv() 仅 main.ts/app.module.ts 链路触发（spec 不 import AppModule），
      # 设假值反而误导"CI 起了 MinIO"。JWT_SECRET 全仓无引用（env.ts 无此键），不设。
      # REDIS_URL 虽有默认值，显式指到 service 端口以免默认值与 service 映射漂移。
      DATABASE_URL: postgresql://flowweb:123456@localhost:5432/flowweb
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # prisma generate：pnpm 默认不执行依赖包 build/postinstall 脚本（@prisma/client 的
      # postinstall=generate）——CI 首跑实证：无此步则 .prisma/client 为 stub，api tsc 全线
      # "no exported member 'Session'..." 炸（本地绿是因本地 client 早已生成）。两 job 均需。
      - run: pnpm --filter @flowweb/api exec prisma generate
      - run: pnpm --filter @flowweb/shared build
      - run: node scripts/check-hocuspocus-pin.mjs
      # 表必须先于 verify 建好（0.5 的 int spec 直连真库且 skip 条件只看 DATABASE_URL 存在——
      # 0.5 已落地，按预留注记启用）。migrate deploy=幂等（已应用跳过）。
      - run: pnpm --filter @flowweb/api exec prisma migrate deploy
      # 单一真相源：CI 直接跑 verify（shared typecheck/test + web/api tsc + 全测 + web lint）
      - run: pnpm verify
      # api eslint（批0e-3 起 verify 未含 api lint，单独一步挂门禁）
      - run: pnpm --filter @flowweb/api exec eslint "{src,test}/**/*.ts"

  # 第八轮拆分：文档门禁独立 job——verify && 链内 doc-gate 的红会掩掉下游测试信号、自身红绿也被
  # flaky 噪声吞掉（TD-26②）；required check 粒度需单独可读（test+doc-gate 双 required=机制+强制）。
  # doc-gate 零 npm 依赖（node 内建+git），无需 pnpm install。
  doc-gate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/doc-gate.mjs

  # 0 号动作 E41：密钥防回归门禁（判定标准=零新增命中，非吊销已知密钥——2026-10-06
  # 用户裁定源码存量均为测试密钥公开无妨）。全历史扫描+仓根 .gitleaks.toml 豁免存量；
  # 本地等价：gitleaks detect --source .；pre-commit 侧 protect --staged（scripts/hooks/）。
  # 故意变红证据（D13）：高熵假密钥 sk-9fQ2…入暂存区 → protect --staged exit 1（2026-10-06）。
  # gitleaks 版本 pin 8.30.1（与本地验证同版本，配置即契约）。
  gitleaks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact -v

  # 批7 双客户端 E2E 发布门禁（spec v5.10 目标 8 链路）：nightly schedule + workflow_dispatch，
  # PR 不跑；步骤=gate 脚本单一真相源（预检→自拉 API(COLLAB_FAKE_AI=1)→playwright collab-recovery→清理）。
  # 本地等价：node scripts/gate-collab.mjs。手动清单：docs/superpowers/plans/collab-e2e-gate-checklist.md
  e2e-collab:
    if: github.event_name == 'workflow_dispatch' # schedule 已摘（C′）——dispatch-only 回归入口，当下 runner 上仍红（MinIO，见上方摘 cron 注记）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: flowweb, POSTGRES_PASSWORD: '123456', POSTGRES_DB: flowweb }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://flowweb:123456@localhost:5432/flowweb
      REDIS_URL: redis://localhost:6379/0
      # validateEnv 必填键（app.module 链路真启动）。MinIO 初始化由 gate-collab.mjs 注入
      # MINIO_INIT=skip 显式裁剪（B′，2026-10-05 终裁）：gate 场景零 MinIO 产物消费；真
      # service 不可得——镜像分发 2025 全网下架（docker.io repo 404/bitnami tags 清零/
      # quay 匿名不可拉/dl.min.io 410）。生产 fail-fast 不动（不设 env 即真连失败 throw）。
      # 下方 MINIO_* 值仅满足 validateEnv 必填校验——skip 路径无连接发生。
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 同 test job：pnpm 不跑依赖 postinstall，gate 的 api build（tsc）需要 prisma client
      # （migrate deploy+seed 由 gate 脚本自带 :166-167）
      - run: pnpm --filter @flowweb/api exec prisma generate
      - run: node scripts/gate-collab.mjs
      # R2d-8 追加三 step（token 门禁进 CI——本地先绿再挂）。web 前置确认：gate 只自拉 API
      # （dist/main.js 子进程，finally 恒收）；web 5173 归 collab 配置 webServer（vite preview），
      # 随 playwright 退出自动拆除——gate 步结束后 3000/3001/5173 全空闲。下列步骤走默认
      # playwright.config.ts 自管双 webServer（API=migrate deploy+seed+nest start /
      # web=build+preview，均 reuse=false/true 语义内建），自包含无需额外前置；
      # css-baseline-diff 纯静态基线比对（不启动浏览器/服务）。
      - run: pnpm --filter @flowweb/web exec playwright test e2e/b0-token-blocks.spec.ts
      - run: pnpm --filter @flowweb/web exec playwright test e2e/b1-token-migration.spec.ts --grep "B1-4"
      - run: node apps/web/scripts/css-baseline-diff.mjs

  # Y0a-1（E69③ 最小起步·spec §4.5 v2.4 收敛）：collab-core 唯一增量=int 真库显式清单+passed 口径条数
  # 断言。库锚/语料/契约门禁均为常规 vitest spec——test job 经 verify 已常跑，此处重跑=第二真源（防双源，
  # "collab 绿"唯一定义=test job）；kill -9/SIGTERM 演练自 Y0a-2 起；dist 泄漏断言已入根 verify（Task 7）。
  # 条数断言不用 numTotalTests（skip 计入——DATABASE_URL 缺失时全 skip 也过=被它要防的模式击穿）。
  collab-core:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: flowweb, POSTGRES_PASSWORD: '123456', POSTGRES_DB: flowweb }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      # Y0a-2（X3/P7）：演练子进程起 AppModule 含 BullMQ（subscription-scheduler onModuleInit await
      # getRepeatableJobs——无 Redis 即挂起）——spec §4.5"redis service Y0a-3 起补"按演练实际需求提前（偏差已登记）。
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://flowweb:123456@localhost:5432/flowweb
      REDIS_URL: redis://localhost:6379/0
      # MINIO_*（X3）：占位值仅过 validateEnv，MINIO_INIT=skip 路径零连接（e2e-collab 先例 B′ 终裁）——
      # 演练子进程由驱动 startServer 内部再注入同款（双保险）。
      MINIO_INIT: skip
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: drill
      MINIO_SECRET_KEY: drill-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowweb/api exec prisma generate
      - run: pnpm --filter @flowweb/shared build
      - run: pnpm --filter @flowweb/api exec prisma migrate deploy
      # X16 纪律：新增 *.int.spec.ts ⇒ 同步扩下方显式清单+条数阈值——否则文件永不跑而断言依旧绿（静默漏跑）。
      - name: collab int（显式清单——本批四个 int spec；双 reporter=失败用例名在 CI 日志可读）
        run: pnpm --filter @flowweb/api exec vitest run src/modules/collab/canvas-doc-update.repository.append.int.spec.ts src/modules/collab/canvas-doc-update.repository.compact.int.spec.ts src/modules/collab/canvas-doc-hydration.int.spec.ts src/modules/collab/collab-spool.int.spec.ts --reporter=json --reporter=default --outputFile=/tmp/int.json
      - name: int 条数断言（passed≥16=15 现清单+spool int 1，且零失败零跳过——红证据：注释 DATABASE_URL 跑一次必红）
        # 块标量必修：裸 run 标量含 'FAIL: passed' 的 ": " 序列=整文件 YAML 解析失败（Y0a-1 起本行
        # 从未可解析——collab-core 实为从未跑过的死 job，Y0a-2 本地 js-yaml 实证并修复）。
        run: |
          node -e "const r=require('/tmp/int.json');const p=r.numPassedTests??0,f=r.numFailedTests??0,s=r.numPendingTests??0;if(f>0||s>0||p<16){console.error('FAIL: passed',p,'failed',f,'skipped',s);process.exit(1)}console.log('collab int passed:',p)"
      # Y0a-2 演练=本 job 真增量（子进程形态 test job 无法跑，spec §4.5③）：四跑必须串行——触发器函数名
      # 全局共享（Task 9 Minor 5）；驱动 tsx 直跑（驱动自身无 DI），server 侧由驱动先跑 tsconfig.drill.json
      # 全量 tsc（首次编译时间计入本步预算，不设独立上界）+dist 产物在 job workspace；Linux 走 SIGTERM
      # 真信号=生产同构通道；env 供给=job 级 DATABASE_URL/REDIS_URL+驱动内注入 MINIO 占位（双保险）。
      - name: kill -9/SIGTERM 演练（G-1 双模式+G-2a 双档——RPO 契约的唯一测试证明）
        run: |
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=kill9-normal
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=kill9-fault
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=sigterm
          pnpm --filter @flowweb/api exec tsx scripts/collab-kill9-drill.ts --mode=sigterm --spool-fail
