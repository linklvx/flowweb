# deploy/nginx/internal-media-location.replace.conf —— Y1a+Y1b T5（读 ACL 团队级单门+content 两态）
# **X-Accel 内部 location 配置片段（运维并入用——非完整 conf，同目录 api-location.replace.conf 惯例）**。
#
# 作用：api 的 GET /api/media/:fileId/content 在生产档（api env 设 MEDIA_X_ACCEL_PREFIX=/internal-media）
# 返回 `X-Accel-Redirect: /internal-media/<bucket>/<key>` + 缩略头（Content-Type/Disposition/nosniff），
# 由 nginx 从下列 internal location 承载字节——API 零字节搬运；Range/HEAD/ETag/304/206/416 由 nginx
# 按静态文件语义原生处理（不 302 公网 presign）。`internal;` 是唯一公网门：外网直访 /internal-media/
# 一律 404，对象字节只经 api 单门（assertTeamMember+已发布作品兜底）放行后到达。
#
# 服务器现状（2026-10 勘察记忆）：单机 nginx+MinIO 同机（127.0.0.1:9000，单盘）。
# 二选一（部署窗 `nginx -T` 核验后定夺——T6 开工前置含 /flowai location 存在性同批核）：
#
# ── 方案 A（对象文件直读——仅当 MinIO 数据目录为平铺文件布局时可用）──
# 验证：`ls /data/minio/flowai/<某对象key>` 是**文件**（非目录）才可用方案 A；
# 现代 MinIO 单盘即 erasure（对象=目录+xl-meta）——不满足则用方案 B。
# location /internal-media/ {
#     internal;
#     alias /data/minio/;          # 末斜杠对齐前缀：/internal-media/flowai/key → /data/minio/flowai/key
# }
#
# ── 方案 B（内代 MinIO——与后端布局无关，通用）──
# 前置（一次性）：mc anonymous set download local/flowai —— 桶对象读开放（写/列举仍私有）；
# 公网不可达面由本 location 的 internal; 承担。**spec 评审修正：anonymous download 是桶级读策略——
# 公网 /flowai/<key> 反代同桶，知道 key 即免签可读（原表述「/flowai 维持 presigned 校验不变」在该
# 语义下不成立）；既有 presigned URL 继续有效；/flowai 公网面收紧=部署窗手测⑥实证后定夺**。
# location /internal-media/ {
#     internal;
#     rewrite ^/internal-media/(.*)$ /$1 break;
#     proxy_pass http://127.0.0.1:9000;
#     proxy_http_version 1.1;
#     proxy_set_header Host 127.0.0.1:9000;     # 与 /flowai location 同款（MinIO Host 语义）
#     proxy_read_timeout 300s;
# }
#
# 部署窗手测清单（CI 无法验生产 nginx——本卡登记项，逐条留证）：
# ① api env 增 MEDIA_X_ACCEL_PREFIX=/internal-media（ecosystem/api env 块；禁入服务器 .env——Z89 ㉑ 同款分叉键纪律）
#    并随 SAFE_FETCH_HOST_ALLOWLIST/SAFE_FETCH_MAX_CONTENT_LENGTH 评审（默认域/2GiB 限额是否需环境覆写）。
# ② 并入上述 location（二选一）→ nginx -t → reload（失败回滚步骤见 runbook §3）。
# ③ curl -i -H 'Range: bytes=0-99' -b '<会话cookie>' https://<域>/api/media/<fileId>/content
#    → 206 + Content-Range + Accept-Ranges（视频可拖动）；HEAD → 200+Content-Length；If-None-Match → 304。
# ③′ Content-Type 断言（质评 Important-2）：上传「声明 MIME 与实际字节不一致」样本对象（声明
#    image/png 实为 mp4 字节）验证 X-Accel 档最终 Content-Type——方案 A alias 按文件扩展名
#    mime.types 重算/方案 B 透传对象 declared Content-Type：两方案均令 API 嗅探优先
#    （sniffedMimeType）语义失真【已知语义漂移，接受】；安全面由 Content-Disposition（非白名单
#    MIME 一律 attachment）+nosniff 兜住——两头 API 侧恒置，实证 X-Accel 档下仍透传生效。
# ④ curl -i https://<域>/internal-media/flowai/<key> → 404（internal 门自证）。
# ⑤ 无会话 cookie 直访 content → 401；他团成员 cookie → 403（单门生产实证）。
# ⑥ 方案 B 专用（anonymous 公网面——spec 评审发现）：mc anonymous set download 后
#    curl -i 'https://<域>/flowai/<key>'（无任何签名参数）——若 200 则公网知道 key 即免签可读
#    （anonymous 读策略经 /flowai 反代直达，签名校验失效）。部署窗必须实证并定夺 /flowai 收紧方案
#    （候选：公网 /flowai location 收紧/摘除改直连/键不可枚举性评估+风险登记）——anonymous 只应
#    服务 127.0.0.1 内代面。
