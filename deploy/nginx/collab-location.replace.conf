# deploy/nginx/collab-location.replace.conf —— Y0a-4：**替换**（非追加）服务器站点配置中既有
# location /collab block（同 server 双 location = nginx -t duplicate 必炸）。
# 运维步骤（runbook §3）：①备份站点文件 ②删除旧 /collab block 整段 ③贴入本文件内容
# ④sudo nginx -t 失败即 cp 备份回滚 ⑤systemctl reload nginx。
location /collab {
    access_log off;                 # E13 止血：WS query token 不落 access log（Y0b cookie-only 根治）
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;        # 依据：心跳间隔+COLLAB_TIMEOUT=30s 量级——默认 60s 剪空闲 WS
    proxy_send_timeout 300s;
    proxy_buffering off;            # WS 帧不缓冲
}
# drain 端点公网封禁（deploy-guard 走 127.0.0.1:3000 直连不经 nginx——零副作用；@SkipThrottle
# 覆盖 drain 的爆破面经此关闭）：
location = /api/drain { deny all; }
# Y0c T27：worker 内部写端点公网封禁（nginx 纵深——worker 走 127.0.0.1:3000 直连不经 nginx，
# 零副作用）。deny 生效时后两条指令不参与求值——并列在此=「deny 若被运维放宽（如内网 CIDR）
# 时上限随身」的纵深形态：body 2m（端点批字节 Σ≤256KB 的 nginx 前置上界——Z108
# MAX_WRITE_BATCH_BYTES 同源）/read 30s（显式覆盖 /api 段 1860s 继承——写批上界=秒级）。
location = /api/collab/doc/write-batch {
    deny all;
    client_max_body_size 2m;
    proxy_read_timeout 30s;
}
# Y0c T27：worker 读端点公网封禁（同族纵深——动态 :projectId 段用 regex 精确匹配，形态对齐
# api 侧 auth.guard WORKER_CANVAS_READ_RE；用户面 shrink/export-fresh/vacuum 不在匹配内——
# 公网可达维持会话鉴权）：
location ~ ^/api/collab/doc/[^/]+/canvas$ {
    deny all;
}
