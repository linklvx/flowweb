# deploy/nginx/api-location.replace.conf —— Y0b-2 T8（Z90 /api 段墙钟钉仓）：**指令清单（并入用）**
# 本文件不是 nginx include 片段，也不是完整 location block——是运维把以下两条 timeout 指令
# **并入**服务器站点配置既有 location /api block 的清单（proxy_pass/X-Forwarded-* 等既有指令原样
# 保留——照抄整段替换会丢 proxy_pass=API 路由哑弹到静态根+throttler getClientIP 全体 127.0.0.1，
# 且 nginx -t 不拦这类语义缺失；同指令重复 nginx -t 炸——既有 block 若已有该指令需改值非加行）。
# 运维步骤见 runbook §3：备份→并入→nginx -t 失败回滚→reload。
# 整条同步链唯一墙钟：apiFetch 无 timeout / Node requestTimeout 只管收请求 / server.timeout=0 实测均非上界。

proxy_read_timeout 1860s;   # = EXEC_SYNC_HARD_CAP(1800s) + 60s 核销/响应余量——相对式推导（禁写死单节点值：
                            # 合法批的时长上界就是 HARD_CAP 本身）。修改 EXEC_SYNC_HARD_CAP 或任一
proxy_send_timeout 1860s;   # EXEC_DEADLINE_* 必须同批重算本值（两旋钮一条算术关系绑定——runbook 联动行
                            # + scripts/check-nginx-budget.mjs 双锚）。超此值只可能是已被 4xx 挡住的
                            # 病态批（EXEC_SCOPE_TOO_LARGE 硬闸——Σdeadline≤HARD_CAP）⇒504 只剩回执丢失
                            # 语义（服务端继续跑、产物经 doc 投影照达——禁加"断连即取消"）。
