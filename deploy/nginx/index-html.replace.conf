# deploy/nginx/index-html.replace.conf —— Y0b-3 T5（M-10）：index.html 禁缓存（新增独立精确 block——
# 非替换既有段：location = /index.html 精确匹配优先级高于 location / 前缀匹配，与既有静态路由零冲突；
# 若站点已存在同 block 则删旧贴新，同 location 重复 nginx -t 必炸）。
# 语义：index.html 被 CDN/浏览器缓存钉死=旧 bundle（无 csv 参数）恒收 client-version-missing——
# reload 拿到的仍是旧 index=版本拒绝循环。hash 资源（assets/*）不受影响维持长缓存。
# ⚠ add_header 不继承：本 block 生效后 server 段既有 add_header（安全头等）对 index.html 失效——
# 需要时原样复制进本 block。运维步骤（runbook §3 同款）：①备份站点文件 ②贴入本文件内容
# ③sudo nginx -t 失败即 cp 备份回滚 ④systemctl reload nginx。部署门=deploy.sh verify_nginx（nginx -T 断言）。
location = /index.html {
    add_header Cache-Control "no-store" always;
}
