# deploy/postgres/pitr-template.conf — Y0c T38（Z16/PITR 降档）：PostgreSQL PITR 配置模板
#
# ★ 模板未启用——服务器零动作（纯仓内文件）。Y7 上线前执行清单见
#   docs/superpowers/full-stack-backup.md §5.2（含版本核查/归档目录预建/断言/恢复演练六步）。
#   启用=改 /etc/postgresql/16/main/postgresql.conf（版本以服务器实际为准——2026-10-16
#   ssh 实测 psql (PostgreSQL) 16.14 (Ubuntu 16.14-0ubuntu0.24.04.1)，配置目录 /etc/postgresql/16）
#   +重启 PostgreSQL+归档目录预建（sudo mkdir -p /home/ubuntu/wal-archive && sudo chown postgres:postgres）。
#
# 当前恢复面=daily pg_dump（scripts/pg-dump-daily.sh，RPO≤24h）；本模板启用后 RPO≈WAL 段粒度。
# 空间守护：WAL 归档目录纳入 >85% 水位巡检口径（deploy.sh 拒部署门/runbook §6 ② 同源）；
# 归档滚动/清理策略 Y7 启用时定（archive_command 失败会阻塞 WAL 回收——pg_wal 无界增长是
# PITR 的经典自伤面，必须与水位巡检同批接通）。

# ── 以下三参合入 postgresql.conf（合入前 sudo cp 备份至 ~/backups/——runbook §12 步骤 2 同款纪律）──

wal_level = replica                     # WAL 归档最低要求（当前 Ubuntu 16 默认即 replica——显式钉死防漂移）
archive_mode = on                       # 启用 WAL 归档（需重启生效，非 reload）
archive_command = 'test -f /home/ubuntu/wal-archive/%f || cp %p /home/ubuntu/wal-archive/%f'
                                        # 已存在即跳过（幂等——test -f 真⇒|| 短路 exit 0；旧形态
                                        # `test ! -f && cp` 在已存在时 exit 1=PG 无限重试阻塞 WAL
                                        # 回收，与幂等语义相反——T39 修复）；cp 失败非零⇒PG 重试
                                        # 且不回收该段（fail-loudly）。fail-loudly vs skip 的
                                        # 语义再裁决挂 Y7 启用时。
# 选型注（T39）：PG 15+ 另有 archive_library（共享库直调，免 shell）；现选 archive_command=
# 16 兼容通用形态（shell 表达直观+跨版本文档示例同构），Y7 启用时可按届时版本重评。

# ── 恢复面（PITR 恢复时使用，平时保持注释——放这里仅作单一权威留档）──
# restore_command = 'cp /home/ubuntu/wal-archive/%f %p'
# recovery_target_time = '2026-10-16 12:00:00+08'   # 或 recovery_target_lsn / recovery_target_name
# recovery_target_action = 'pause'                    # 到点后暂停供人工核验，确认再 promote
